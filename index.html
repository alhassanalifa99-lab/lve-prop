<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Abigail Atawobe ❤️</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b0b1e 0%, #0a0207 100%);
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            pointer-events: none;
        }

        .header {
            text-align: center;
            animation: fadeInDown 2s ease-out;
        }

        .header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            color: #ff6584;
            text-shadow: 0 0 20px rgba(255, 101, 132, 0.6);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #e0b0ff;
            text-transform: uppercase;
            font-weight: 300;
        }

        .card-wrapper {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 0 20px rgba(255, 105, 180, 0.2);
            animation: fadeInUp 2s ease-out;
        }

        .message {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #fff0f5;
            font-weight: 300;
        }

        .emojis {
            font-size: 2rem;
            margin-top: 10px;
            display: block;
            animation: pulse 1.5s infinite alternate;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.8);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            position: absolute;
            right: 40px;
        }

        /* Success Overlay */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 2, 7, 0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .celebration-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .celebration-overlay h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: #ff416c;
            text-shadow: 0 0 30px rgba(255, 65, 108, 0.8);
            margin-bottom: 20px;
            text-align: center;
        }

        .celebration-overlay p {
            font-size: 1.5rem;
            color: #ffd1dc;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2.8rem; }
            .card-wrapper { padding: 25px 20px; width: 90%; }
            .message { font-size: 1.05rem; }
            .celebration-overlay h2 { font-size: 3.5rem; }
        }
    </style>

    <!-- Import Three.js & GSAP via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- 3D Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- UI Overlay -->
    <div class="ui-container">
        <div class="header">
            <h1>Abigail Atawobe</h1>
            <p>Forever & Always</p>
        </div>

        <div class="card-wrapper">
            <div class="message">
                "will you make me the happiest person in the world?
                And Stay by my side forever, Abigail 💖"
                <span class="emojis">💖 🥺 💕 👩‍❤️‍💋‍👨 ✨</span>
            </div>

            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn">Yes! 💖</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <!-- Celebration Overlay on YES -->
    <div class="celebration-overlay" id="celebration">
        <h2>You Made Me The Happiest! 🥰</h2>
        <p>I promise to stay by your side forever, Abigail 💕</p>
    </div>

    <!-- 3D Scene Script -->
    <script>
        // --- 1. THREE.JS SETUP ---
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff416c, 3, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const pointLight2 = new THREE.PointLight(0x8a2be2, 3, 50);
        pointLight2.position.set(-5, -5, -2);
        scene.add(pointLight2);

        // --- 3. 3D HEART GEOMETRY ---
        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 0.25, y + 0.25);
        heartShape.bezierCurveTo(x + 0.25, y + 0.25, x + 0.2, y, x, y);
        heartShape.bezierCurveTo(x - 0.3, y, x - 0.3, y + 0.35, x - 0.3, y + 0.35);
        heartShape.bezierCurveTo(x - 0.3, y + 0.55, x - 0.1, y + 0.77, x + 0.25, y + 0.95);
        heartShape.bezierCurveTo(x + 0.6, y + 0.77, x + 0.8, y + 0.55, x + 0.8, y + 0.35);
        heartShape.bezierCurveTo(x + 0.8, y + 0.35, x + 0.8, y, x + 0.5, y);
        heartShape.bezierCurveTo(x + 0.35, y, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

        const extrudeSettings = {
            depth: 0.4,
            bevelEnabled: true,
            bevelSegments: 8,
            steps: 2,
            bevelSize: 0.15,
            bevelThickness: 0.15
        };

        const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        geometry.center();

        // Shiny Glass/Ruby Material
        const material = new THREE.MeshPhysicalMaterial({
            color: 0xff1493,
            emissive: 0x330011,
            roughness: 0.1,
            metalness: 0.1,
            transmission: 0.6,
            thickness: 1.2,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            ior: 1.5
        });

        const heartMesh = new THREE.Mesh(geometry, material);
        heartMesh.rotation.z = Math.PI; // Flip heart right side up
        heartMesh.scale.set(1.8, 1.8, 1.8);
        scene.add(heartMesh);

        // --- 4. FLOATING PARTICLES ---
        const particlesCount = 300;
        const positions = new Float32Array(particlesCount * 3);
        const scales = new Float32Array(particlesCount);

        for (let i = 0; i < particlesCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 15;
            positions[i + 1] = (Math.random() - 0.5) * 15;
            positions[i + 2] = (Math.random() - 0.5) * 15;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particleMaterial = new THREE.PointsMaterial({
            color: 0xffb6c1,
            size: 0.08,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // --- 5. ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Smooth Heart Floating & Rotating
            heartMesh.rotation.y = elapsedTime * 0.5;
            heartMesh.rotation.x = Math.sin(elapsedTime * 0.8) * 0.1;
            heartMesh.position.y = Math.sin(elapsedTime * 1.5) * 0.2;

            // Particle Subtle Movement
            particleSystem.rotation.y = elapsedTime * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // --- 6. INTERACTIVE BUTTON LOGIC ---
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const celebration = document.getElementById('celebration');

        // Make "No" button run away on hover
        noBtn.addEventListener('mouseover', () => {
            const x = (Math.random() - 0.5) * 200;
            const y = (Math.random() - 0.5) * 200;
            gsap.to(noBtn, {
                x: x,
                y: y,
                duration: 0.3,
                ease: "power2.out"
            });
        });

        // "Yes" Click Celebration
        yesBtn.addEventListener('click', () => {
            celebration.classList.add('active');

            // 3D Heart scale up animation
            gsap.to(heartMesh.scale, {
                x: 3,
                y: 3,
                z: 3,
                duration: 2,
                ease: "elastic.out(1, 0.3)"
            });

            // Fire Confetti
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 100,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });
            }, 400);
        });

        // --- 7. RESPONSIVE RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
